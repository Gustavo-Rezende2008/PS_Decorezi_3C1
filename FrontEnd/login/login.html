<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Estrutural Model</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <!-- Logo pequeno -->
        <div class="logo-menu"></div>

        <nav class="menu">

            <a href="../index.html">INICIO</a>

            <a href="../sobre-nos/sobre-nos.html">SOBRE-NÓS</a>

            <a href="../projetos/projetos.html">PROJETOS</a>

            <a href="../contatos/contatos.html">CONTATO</a>

            <a href="../login/login.html">CONTA</a>

        </nav>

    </header>


    <!-- =========================
         ÁREA DE LOGIN
    ========================== -->

    <main class="login-container">

        <!-- Logo principal -->
        <div class="logo-principal"></div>


        <h1>ENTRAR</h1>


        <!-- E-MAIL -->

        <div class="campo">

            <input
                type="email"
                id="email"
                placeholder="DIGITE SEU E-MAIL"
            >

            <a href="../cadastro/Cadastro.html">
                NÃO POSSUI UMA CONTA? REGISTRE-SE
            </a>

        </div>


        <!-- SENHA -->

        <div class="campo campo-senha">

            <input
                type="password"
                id="senha"
                placeholder="DIGITE SUA SENHA"
            >

        </div>


        <!-- BOTÃO -->

        <button class="botao">
            PRÓXIMO
        </button>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer class="footer"></footer>

</body>

</html>
